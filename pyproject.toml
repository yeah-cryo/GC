[project]
name = "real-reference"
version = "0.1.0"
description = "ResNet-50 critic for detector-guided AI-generated image detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "pyarrow>=15",
    "pytest>=8",
    "safetensors>=0.4",
    "scikit-learn>=1.4",
    "torch>=2.5",
    "torchvision>=0.20",
    "diffusers>=0.36",
    "transformers>=4.57",
    "pyiqa>=0.1.13",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "swanlab>=0.7",
    "pytorch-wavelets>=1.3.0",
    "pywavelets>=1.8.0",
    "setuptools<81",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aigi_detection"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
